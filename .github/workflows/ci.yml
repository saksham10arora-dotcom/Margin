name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Sidecar (pytest)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is included deliberately: the README claims macOS/Linux only,
        # and this is what turns that from a guess into a fact one way or the
        # other. A failure here is a real finding, not CI noise.
        # What Margin supports: macOS and Linux, Python 3.11 (the minimum) to current.
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sidecar/requirements.txt
      - name: Run tests
        # No network, no API keys: every engine call is mocked. If a test
        # starts needing either, that is the bug, not the CI config.
        run: python -m pytest sidecar/tests/ -q

  extension:
    name: Extension (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    name: Release zip
    runs-on: ubuntu-latest
    needs: [backend, extension]
    steps:
      - uses: actions/checkout@v4
      - name: Build the download (and refuse if a key is in it)
        run: bash scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: margin
          path: dist/margin-*.zip
          if-no-files-found: error
